# Refresh publications from Dr. Bakli's ORCID record (+ Crossref) every Monday,
# or on demand ("Run workflow" on GitHub, or the button on admin.html).
name: Refresh publications
on:
  schedule:
    - cron: "30 3 * * 1"
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: site-update
  cancel-in-progress: false
jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Fetch publications from ORCID
        run: python3 tools/update_publications.py
      - name: Build pages
        run: python3 tools/build.py
      - name: Commit if anything changed
        run: |
          git config user.name "tensorelab-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # the 'updated' date alone is not a real change
          if git diff --quiet -- data/publications.json; then echo "Publications unchanged"; exit 0; fi
          git add -A
          git commit -m "Refresh publications from ORCID"
          git pull --rebase origin main
          git push origin HEAD:main
